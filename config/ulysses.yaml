agent_name: Ulysses
agent_version: "1.0"
llm:
  provider: openai
  model: gpt-4.1-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
audio:
  enabled: true
  text_only: false
  input_device: auto
  output_device: auto
  language: auto
  silence_seconds: 1.1
  max_utterance_seconds: 20
wake_word:
  enabled: true
  models:
    - hey_ulysses
  threshold: 0.55
sirina:
  stt_engine: tdt
  tts_voice: am_michael
memory:
  sqlite_path: var/ulysses/sessions.sqlite3
  faiss_path: var/ulysses/memory.faiss
  metadata_path: var/ulysses/memory.jsonl
  embedding_provider: local_hash
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  top_k: 6
context:
  auto_consolidate: true
  context_window_tokens: 128000
  max_messages: 40
  max_chars: 24000
  keep_last_messages: 12
  summary_target_chars: 3000
autonomous:
  check_interval_seconds: 90
  report_probability: 0.35
  min_seconds_between_reports: 180
  max_recent_messages: 8
  defense_checks_enabled: true
  defense_elevated_interval_seconds: 45
  defense_critical_interval_seconds: 15
  defense_report_min_score: 0
  auto_block_attackers: true
  install_missing_security_apps: true
skills:
  internet_search_enabled: true
  command:
    enabled: true
    godmode: false
    bypass_confirmation_for_allowed_commands: true
    require_confirmation: true
    require_typed_confirmation_for_high_risk: true
    working_directory: .
    allowed_commands: [pwd, ls, cat, sed, rg, git, python, python3, df, lsblk, fdisk, nmap, uname, uptime, who, last, ss, ps, ip, journalctl, which]
    denied_commands: [rm, sudo, su, chmod, chown, mkfs, mount, umount]
logging:
  directory: var/ulysses/logs
tui:
  theme: ulysses_dark
prompt:
  personality: >-
    Pragmatic, calm, technically rigorous, concise, and security-aware.
    Speak like a capable Kali Linux penetration tester and vulnerability assessor.
  instructions: >-
    You are a local-first Kali Linux security assistant for authorized vulnerability assessment,
    penetration testing, tool operation, evidence collection, and remediation guidance. Use concise answers.
    Treat the local system you run on as a protected host and prioritize defending it from compromise.
    Bring expert knowledge of XSS, IDOR, BOLA, certificate/TLS vulnerabilities, cloud security, and local Linux security.
    When a request needs multiple independent operations, call the needed tools in one batch or in a short sequence,
    then summarize the combined results and respond once.
    Prefer Markdown reports for assessed systems. Rank vulnerabilities by severity, include technical proof of concept
    details, and provide detailed remediation steps.
    Ask for confirmation before risky skills. Respect privacy and never expose secrets.
  system_prompt_path: prompts/ulysses_system.md
privacy:
  privacy_mode: false
  redact_logs: true
  retrieve_memory: true
